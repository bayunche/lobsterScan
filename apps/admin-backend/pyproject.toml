[project]
name = "admin-backend"
version = "0.1.0"
description = "OpenClaw 管理平台 · 后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "cryptography>=42.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
