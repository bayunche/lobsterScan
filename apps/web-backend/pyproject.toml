[project]
name = "web-backend"
version = "0.1.0"
description = "会汇报 · 任务编排后端 + huihuibao-web Channel Plugin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "aiosqlite>=0.20",
  "sqlalchemy>=2.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pdfminer.six>=20240706",
  "httpx>=0.27",
  "pillow>=12.2.0",
  "imageio>=2.37.3",
  "imageio-ffmpeg>=0.6.0",
  "numpy>=2.4.6",
  "edge-tts>=7.2.8",
  "playwright>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
